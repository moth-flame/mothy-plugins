# gitleaks config for mothy-plugins.
#
# This repo is a Claude Code plugin marketplace. It MUST stay credential-free:
# the MCP connection authenticates via OAuth at connect time, so no token,
# service-account key, or bearer string should ever land in git.
#
# Run locally: gitleaks detect --config .gitleaks.toml --no-banner

title = "mothy-plugins secret scan"

[extend]
# Start from gitleaks' built-in ruleset, then add repo-specific deny rules.
useDefault = true

[[rules]]
id = "mothy-oct-token"
description = "Mothy per-user OAuth token (oct_...)"
regex = '''oct_[a-z0-9_]+'''
tags = ["mothy", "token"]

[[rules]]
id = "mothy-token-env"
description = "MOTHY_TOKEN assignment"
regex = '''MOTHY_TOKEN\s*=\s*\S+'''
tags = ["mothy", "env"]

[[rules]]
id = "google-service-account-key"
description = "Google service-account key var"
regex = '''GOOGLE_SERVICE_ACCOUNT_KEY\s*[:=]\s*\S+'''
tags = ["google", "service-account"]

[[rules]]
id = "bearer-token-literal"
description = "Literal Bearer token"
regex = '''Bearer\s+[A-Za-z0-9._\-]{8,}'''
tags = ["auth", "bearer"]

[[rules]]
id = "elevenlabs-api-key"
description = "ElevenLabs API key (sk_... style) or xi-api-key assignment"
regex = '''(?i)(?:xi[-_]?api[-_]?key|elevenlabs[_-]?api[_-]?key)\s*[:=]\s*['"]?sk_[A-Za-z0-9]{20,}'''
tags = ["elevenlabs", "api-key"]

[[rules]]
id = "elevenlabs-sk-token"
description = "ElevenLabs sk_ token literal"
regex = '''\bsk_[a-f0-9]{40,}\b'''
tags = ["elevenlabs", "api-key"]

[[rules]]
id = "vimeo-access-token"
description = "Vimeo personal access token / bearer assignment"
regex = '''(?i)(?:vimeo[_-]?access[_-]?token|vimeo[_-]?token)\s*[:=]\s*['"]?[A-Za-z0-9]{32,}'''
tags = ["vimeo", "token"]

[[rules]]
id = "vimeo-bearer-token"
description = "Vimeo bearer token literal (32-byte hex/base64-ish PAT)"
regex = '''(?i)vimeo[^\n]{0,40}\b[0-9a-f]{32}\b'''
tags = ["vimeo", "token"]

[[rules]]
id = "zoho-oauth-token"
description = "Zoho OAuth refresh/access token (1000.<32hex>.<32hex>)"
regex = '''1000\.[0-9a-f]{32}\.[0-9a-f]{32}'''
tags = ["zoho", "oauth", "token"]

[[rules]]
id = "zoho-client-secret-env"
description = "Zoho client secret / refresh token assignment"
regex = '''(?i)ZOHO_(?:CLIENT_SECRET|REFRESH_TOKEN|CLIENT_ID)\s*[:=]\s*['"]?\S{8,}'''
tags = ["zoho", "env"]

[[rules]]
id = "commandiq-demo-capture-password"
description = "CommandIQ demo-capture password assignment"
regex = '''(?i)COMMANDIQ_DEMO_CAPTURE_PASSWORD\s*[:=]\s*['"]?\S+'''
tags = ["commandiq", "password"]

[allowlist]
description = "Docs/tests may mention the patterns abstractly without real secrets"
# Allow placeholder/example forms that are clearly not live secrets.
regexes = [
  '''oct_<''',
  '''oct_hex''',
  '''Bearer <token>''',
  '''Bearer x"''',
  '''Bearer realm''',
  # Env-var-first credential names: allow the NAME itself plus obvious placeholders.
  '''=\s*['"]?(?:<[^>]+>|\$\{?[A-Z_]+\}?|your[_-]|example|placeholder|xxx+|\.\.\.|sk_test_|sk_xxx)''',
  '''=\s*['"]?(?:env|process\.env)''',
  '''1000\.<''',
  '''sk_<''',
  '''sk_your''',
]
paths = [
  '''\.gitleaks\.toml$''',
  '''tests/.*\.test\.mjs$''',
]
