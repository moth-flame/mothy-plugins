name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# NOTE: we run the open-source gitleaks CLI directly instead of
# gitleaks/gitleaks-action@v2. That action requires a paid GITLEAKS_LICENSE
# secret for GitHub *organizations* (moth-flame is an org), so it errored out
# ("missing gitleaks license") on every run and never actually scanned. The
# CLI binary is MIT-licensed and free — same engine, real coverage.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (CLI — no org license required)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1
